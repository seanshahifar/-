[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btcagent"
version = "0.1.0"
description = "Autonomous Bitcoin trading agent: live market data + news sentiment + a trained prediction model, with paper trading, risk controls and a live dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ccxt>=4.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "aiohttp>=3.9",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
btcagent = "btcagent.cli:main"

[tool.setuptools.packages.find]
include = ["btcagent*"]

[tool.setuptools.package-data]
btcagent = ["web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:feedparser.*"]
